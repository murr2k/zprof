# SPDX-License-Identifier: Apache-2.0
# west manifest for zprof (zephyr-dev).
# The repo root is the west workspace: from it run
#   west init -l firmware
#   west update
# Zephyr and modules land in /zephyr and /modules (ignored by .gitignore).
#
# Zephyr is pinned by SHA: Build compare A/B runs need an identical Zephyr.
# Since 2026-11-21 the pin is the v4.4.0 release, the one the first target
# (the stm32n6-demo) runs. Bump deliberately, then re-check the sources cited
# in docs/DASHBOARD_SPEC.md section 3 at the new SHA.
manifest:
  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos

  projects:
    - name: zephyr
      remote: zephyrproject-rtos
      revision: 684c9e8f32e4373a21098559f748f06915f950c9 # v4.4.0
      import:
        name-allowlist:
          - cmsis      # CMSIS-Core(A/R): Zynq PS (Cortex-A9, Cortex-R5)
          - cmsis_6    # CMSIS-Core(M): STM32N6570-DK (Cortex-M55)
          - hal_stm32
          - picolibc
          - segger     # RTT, for SystemView cross-check builds
